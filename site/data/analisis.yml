- slug: quien-gana-mas-en-el-estado
  title: ¿Quién gana más en el Estado?
  date: '2026-09-05'
  category: Instituciones y capital humano
  deck: Remuneraciones públicas, capital humano y el caso del Banco Central.
  description: "¿Debe la remuneración presidencial ser un techo salarial? Una mirada al costo de oportunidad, la selección de talento y la independencia técnica."
  media:
    heading: El debate que abre esta columna
    intro: Este clip plantea, de forma directa, la intuición de que nadie debería ganar más que el Presidente. La columna examina qué factores económicos quedan fuera de esa comparación.
    items:
      - type: instagram
        url: https://www.instagram.com/p/Dc3_FuCFZUt/
        label: Clip de UChile TV sobre remuneraciones públicas. Se reproduce desde la publicación original.
  sources:
    - label: 'Ley Orgánica Constitucional del Banco Central: artículos 1, 7, 10 y 14–17.'
      url: https://www.bcn.cl/leychile/navegar?idNorma=30216
    - label: 'Banco Central: gobierno corporativo y remuneraciones del Consejo.'
      url: https://www.bcentral.cl/es/el-banco/gobierno-corporativo
    - label: 'Banco Central: integrantes del Consejo y antecedentes profesionales.'
      url: https://www.bcentral.cl/el-banco/gobierno-corporativo/personas
- slug: hidrogeno-verde-competitividad
  title: 'Del potencial a la competitividad: el desafío del hidrógeno verde en Chile'
  date: '2026-05-25'
  category: Energía y desarrollo productivo
  deck: Una ventaja natural no es todavía una ventaja competitiva.
  description: "Costos, demanda, infraestructura y valor local: las condiciones para transformar el potencial renovable de Chile en una industria competitiva."
  media:
    heading: Del potencial a la implementación
    intro: En mayo de 2026, Corfo reconocía que el desarrollo de la industria avanzaba más lentamente de lo esperado. El diagnóstico resume el cambio de etapa que analiza esta columna, desde los anuncios hacia costos, demanda y proyectos ejecutables.
    items:
      - type: article
        source: TVU
        date: 3 de mayo de 2026
        title: 'Hidrógeno verde en Biobío: Corfo reconoce lento avance'
        summary: El reportaje recoge miradas del sector público, la academia y la industria sobre la maduración del mercado y las condiciones necesarias para sostener capacidades.
        url: https://www.tvu.cl/prensa/2026/05/03/hidrogeno-verde-en-biobio-corfo-reconoce-lento-avance-apostando-por-sostener-la-industria-a-largo-plazo.html
