        video_id: psy7ZDb2-Xg
        url: https://www.youtube.com/watch?v=psy7ZDb2-Xg
        title: Kast pide rechazar el reajuste del sector público por los amarres
        label: Intervención sobre las llamadas normas de “amarre”, publicada por Diario Financiero TV.
