- slug: cuantos-funcionarios-necesita-el-estado
  title: ¿Cuántos funcionarios necesita el Estado?
  date: '2026-01-31'
  category: Gasto público y productividad
  deck: Una discusión sobre ajuste fiscal, funciones públicas y eficiencia.
  description: "Contar funcionarios no basta para medir la eficiencia. La pregunta es qué servicios queremos, con qué productividad y a qué costo."
  media:
    heading: Dos intervenciones que enmarcaron la discusión
    intro: La primera muestra la retórica sobre los “parásitos” del Estado; la segunda, la controversia de enero de 2026 por las llamadas normas de “amarre”. Ambas convierten un problema real de gestión pública en una discusión sobre personas. La columna propone evaluar funciones, desempeño y capacidades antes de decidir salidas.
    items:
      - type: instagram
        url: https://www.instagram.com/reel/DPy1k4mDo3l/
        label: Cristián Valenzuela responde por su columna “Parásitos”. El clip se reproduce desde Instagram.
