name: Update IMACEC nowcasts

on:
  workflow_dispatch:
  schedule:
    # GitHub cron usa UTC. Se programan los candidatos de UTC-3/UTC-4 y
    # el primer paso filtra exactamente 09:00, 10:00, 10:30, 11:00 y 11:30
    # en America/Santiago.
    - cron: '0 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 15 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'R/imacec_*.R'
      - 'R/00_packages.R'
      - 'scripts/01_update_imacec.R'
      - 'scripts/test_imacec.R'
      - 'data/raw/imacec_ine_yoy_fallback.csv'
      - '.github/workflows/update-imacec.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R/imacec_*.R'
      - 'scripts/01_update_imacec.R'
      - 'scripts/test_imacec.R'
      - 'data/raw/imacec_ine_yoy_fallback.csv'
      - '.github/workflows/update-imacec.yml'

permissions:
  contents: write

concurrency:
  group: imacec-update
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Santiago monitoring window
        id: schedule_window
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset="$(TZ=America/Santiago date +%z)"
          should_run=false

          if [ "$offset" = "-0300" ]; then
            case "$SCHEDULE_EXPR" in
              "0 12 * * 1-5"|"0 13 * * 1-5"|"30 13 * * 1-5"|"0 14 * * 1-5"|"30 14 * * 1-5")
                should_run=true
                ;;
            esac
          elif [ "$offset" = "-0400" ]; then
            case "$SCHEDULE_EXPR" in
              "0 13 * * 1-5"|"0 14 * * 1-5"|"30 14 * * 1-5"|"0 15 * * 1-5"|"30 15 * * 1-5")
                should_run=true
                ;;
            esac
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "America/Santiago offset=$offset · schedule=$SCHEDULE_EXPR · run=$should_run"

      - name: Check BCCh credentials
        if: steps.schedule_window.outputs.should_run == 'true'
        id: credentials
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: |
          if [ -n "$BCCH_USER" ] && [ -n "$BCCH_PASS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BCCH_USER/BCCH_PASS no están configurados; se conserva la última publicación válida."
          fi

      - name: Set up R
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse IMACEC R sources
        if: steps.schedule_window.outputs.should_run == 'true'
        run: Rscript -e 'invisible(lapply(c(list.files("R", pattern = "^imacec_.*[.]R$", full.names = TRUE), "scripts/01_update_imacec.R"), parse))'

      - name: Install R dependencies
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rjson
            any::dplyr
            any::tidyr
            any::lubridate
            any::readxl
            any::ggplot2
            any::knitr
            any::tibble
            any::readr
            any::purrr
            any::stringr
            any::scales
            any::gt
            any::plotly
            any::httr
            any::jsonlite

      - name: Test incomplete cuts and historical fits
        if: steps.schedule_window.outputs.should_run == 'true'
        run: Rscript scripts/test_imacec.R

      - name: Set up Python
        if: steps.schedule_window.outputs.should_run == 'true' && steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site dependencies
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: python -m pip install -r requirements-site.txt

      - name: Run EEE, M4, M8P and official-data cycle
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
          IMACEC_IVS_URL: ${{ vars.IMACEC_IVS_URL }}
        run: Rscript scripts/01_update_imacec.R

      - name: Build and validate site
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          python scripts/build_site.py
          python scripts/validate_site.py

      - name: Commit reproducible outputs
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/imacec_* \
            assets/img/imacec \
            site/assets/data/project_charts.json \
            site/assets/img/charts/imacec_* \
            site/assets/img/projects/imacec.jpg \
            docs
          if git diff --cached --quiet; then
            echo "No hay cambios analíticos para publicar."
          else
            git commit -m "Actualiza ciclo mensual IMACEC"
            git push
          fi
