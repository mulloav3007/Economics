name: Update IMACEC nowcasts

on:
  workflow_dispatch:
  schedule:
    # Ventana redundante para absorber retrasos de GitHub Actions.
    # 07:00-16:30 UTC cubre la mañana chilena incluso con varias horas de cola.
    - cron: '0,30 7-16 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'R/imacec_*.R'
      - 'R/00_packages.R'
      - 'scripts/01_update_imacec.R'
      - 'scripts/test_imacec.R'
      - 'scripts/generate_site_assets.py'
      - 'scripts/build_site.py'
      - 'data/raw/imacec_ine_yoy_fallback.csv'
      - '.github/workflows/update-imacec.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R/imacec_*.R'
      - 'scripts/01_update_imacec.R'
      - 'scripts/test_imacec.R'
      - 'data/raw/imacec_ine_yoy_fallback.csv'
      - '.github/workflows/update-imacec.yml'

permissions:
  contents: write

concurrency:
  # Grupo versionado para no quedar bloqueado por una ejecución antigua/atascada.
  group: imacec-update-v2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Register scheduled poll
        id: schedule_window
        shell: bash
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Poll IMACEC · UTC=$(date -u +%H:%M) · Santiago=$(TZ=America/Santiago date +%H:%M)"

      - name: Check BCCh credentials
        if: steps.schedule_window.outputs.should_run == 'true'
        id: credentials
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: |
          if [ -n "$BCCH_USER" ] && [ -n "$BCCH_PASS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BCCH_USER/BCCH_PASS no están configurados; se conserva la última publicación válida."
          fi

      - name: Snapshot published analytical state
        if: steps.schedule_window.outputs.should_run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          mkdir -p /tmp/imacec-before
          for f in \
            imacec_update_status.csv \
            imacec_model_status.csv \
            imacec_projection_all_models.csv \
            imacec_nowcast_history_all_models.csv \
            imacec_pseudo_oos_metrics.csv \
            imacec_eee_aligned.csv
          do
            if [ -f "data/processed/$f" ]; then
              cp "data/processed/$f" "/tmp/imacec-before/$f"
            fi
          done

      - name: Set up R
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse IMACEC R sources
        if: steps.schedule_window.outputs.should_run == 'true'
        run: Rscript -e 'invisible(lapply(c(list.files("R", pattern = "^imacec_.*[.]R$", full.names = TRUE), "scripts/01_update_imacec.R"), parse))'

      - name: Install R dependencies
        if: steps.schedule_window.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rjson
            any::dplyr
            any::tidyr
            any::lubridate
            any::readxl
            any::ggplot2
            any::knitr
            any::tibble
            any::readr
            any::purrr
            any::stringr
            any::scales
            any::gt
            any::plotly
            any::httr
            any::jsonlite

      - name: Test incomplete cuts and historical fits
        if: steps.schedule_window.outputs.should_run == 'true'
        run: Rscript scripts/test_imacec.R

      - name: Set up Python
        if: steps.schedule_window.outputs.should_run == 'true' && steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site dependencies
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: python -m pip install -r requirements-site.txt

      - name: Run EEE, M4, M8P and official-data cycle
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: Rscript scripts/01_update_imacec.R

      - name: Detect substantive analytical changes
        id: analytical_changes
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          specs = {
              "imacec_update_status.csv": {"fecha_actualizacion", "fecha_hora_actualizacion"},
              "imacec_model_status.csv": {"run_timestamp"},
              "imacec_projection_all_models.csv": {"fecha_actualizacion", "run_timestamp"},
              "imacec_nowcast_history_all_models.csv": {"fit_timestamp"},
              "imacec_pseudo_oos_metrics.csv": set(),
              "imacec_eee_aligned.csv": set(),
          }

          def normalized(path, ignored):
              path = Path(path)
              if not path.exists():
                  return None
              with path.open(encoding="utf-8-sig", newline="") as fh:
                  rows = []
                  for row in csv.DictReader(fh):
                      clean = {k: v for k, v in row.items() if k not in ignored}
                      rows.append(clean)
              return sorted(
                  (json.dumps(row, sort_keys=True, ensure_ascii=False, separators=(",", ":"))
                   for row in rows)
              )

          changed = False
          reasons = []
          for name, ignored in specs.items():
              before = normalized(Path("/tmp/imacec-before") / name, ignored)
              after = normalized(Path("data/processed") / name, ignored)
              if before != after:
                  changed = True
                  reasons.append(name)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
          print("Cambio analítico:", changed, "·", ", ".join(reasons) if reasons else "sin cambios")
          PY

      - name: Build and validate site
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request' && steps.analytical_changes.outputs.changed == 'true'
        run: |
          python scripts/build_site.py
          python scripts/validate_site.py

      - name: Commit reproducible outputs
        if: steps.credentials.outputs.configured == 'true' && github.event_name != 'pull_request' && steps.analytical_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/imacec_* \
            assets/img/imacec \
            site/assets/data/project_charts.json \
            site/assets/img/charts/imacec_* \
            site/assets/img/projects/imacec.jpg \
            docs
          if git diff --cached --quiet; then
            echo "No hay cambios analíticos para publicar."
          else
            git commit -m "Actualiza ciclo mensual IMACEC"
            # Los Excel INE descargados son insumos temporales y no se versionan.
            # Limpia cualquier modificación/no-trackeado restante antes del rebase.
            git reset --hard HEAD
            git clean -fd
            # Si main avanzó mientras corría el job, reaplica la salida analítica
            # sobre el estado remoto más reciente antes de publicar.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
